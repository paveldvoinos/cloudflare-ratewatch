name: CI

on:
  push:
    branches: ["**"]     # every commit on every branch; tags go through release.yml
  pull_request:
  workflow_call:         # release.yml runs this before packaging

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  worker:
    name: Worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Tests (incl. the vectors shared with the Python tests)
        run: npm test
      - name: Bundle and config check
        run: npx wrangler deploy --dry-run --outdir dist

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ruff
        run: |
          pip install --quiet ruff==0.16.9
          ruff check --output-format=github .
      - name: shellcheck
        run: shellcheck -s sh packaging/build-deb.sh packaging/postinst packaging/prerm packaging/postrm
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint
      - name: systemd units
        run: systemd-analyze verify contrib/cf-ratewatch.service contrib/cf-ratewatch.timer
      - name: example config and dashboards parse
        run: |
          python -c "import tomllib; tomllib.load(open('config.example.toml', 'rb'))"
          for f in contrib/grafana/*.json; do python -m json.tool "$f" > /dev/null; done
