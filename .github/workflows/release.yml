name: Release

on:
  push:
    tags: ["v*"]         # v1.2.0, or v1.2.0-rc1 for a pre-release

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deb:
    name: Build .deb
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches __version__
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! grep -qx "__version__ = \"$v\"" cf_ratewatch.py; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ in cf_ratewatch.py"
            exit 1
          fi
      - name: Build
        run: packaging/build-deb.sh "$GITHUB_REF_NAME"
      - name: Lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian > /dev/null
          lintian --fail-on error,warning --info dist/*.deb
      - name: Install, verify, purge
        run: |
          expect_exit() {  # expect_exit CODE TEXT CMD...: CMD exits with CODE and prints TEXT
            code=$1 text=$2; shift 2
            out=$("$@" 2>&1) && rc=0 || rc=$?
            echo "$ $* -> $rc: $out"
            if [ "$rc" != "$code" ] || ! grep -q "$text" <<< "$out"; then
              echo "::error::expected exit $code and '$text' from: $*"
              exit 1
            fi
          }
          sudo apt-get install -y ./dist/*.deb
          # as the unprivileged runner user, who cannot read /etc/cf-ratewatch
          cf-ratewatch --version
          cf-ratewatch --help > /dev/null
          expect_exit 2 "permission denied" cf-ratewatch report
          # as root: the config loads, and the missing token is reported cleanly
          expect_exit 2 "no API token" sudo cf-ratewatch report
          systemd-analyze verify /usr/lib/systemd/system/cf-ratewatch.service /usr/lib/systemd/system/cf-ratewatch.timer
          getent passwd cf-ratewatch
          sudo dpkg --verify cf-ratewatch
          sudo apt-get purge -y cf-ratewatch
          test ! -e /etc/cf-ratewatch
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: Create the release and attach the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.deb SHA256SUMS --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" ./*.deb SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
